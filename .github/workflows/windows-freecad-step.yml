name: FreeCAD pipe 50mm x 5m STEP real test
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-freecad-step.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freecad-step:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout geometry test script
        uses: actions/checkout@v4
      - name: Confirm spare disk and download verified official FreeCAD
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-PSDrive C).Free -lt 6GB) { throw 'Disk free space below 6GB' }
          $tag='1.1.3'
          $headers=@{ 'User-Agent'='CFD-Automation-Test'; 'Authorization'="Bearer $env:GH_TOKEN" }
          $release=Invoke-RestMethod -Uri "https://api.github.com/repos/FreeCAD/FreeCAD/releases/tags/$tag" -Headers $headers
          $name="FreeCAD_$tag-Windows-x86_64-py311.7z"
          $asset=$release.assets | Where-Object {$_.name -eq $name} | Select-Object -First 1
          $checksum=$release.assets | Where-Object {$_.name -eq "$name-SHA256.txt"} | Select-Object -First 1
          if (!$asset -or !$checksum) { throw 'Missing official archive or checksum' }
          $archive=Join-Path $env:RUNNER_TEMP $name
          $hashfile=Join-Path $env:RUNNER_TEMP 'freecad.sha256'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -MaximumRedirection 8
          Invoke-WebRequest -Uri $checksum.browser_download_url -OutFile $hashfile -MaximumRedirection 8
          $match=[regex]::Match((Get-Content $hashfile -Raw),'[A-Fa-f0-9]{64}')
          if (!$match.Success) { throw 'Cannot read official checksum' }
          $realhash=(Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($realhash -ine $match.Value) { throw 'FreeCAD checksum mismatch' }
          $extractor='C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path $extractor)) { throw '7-Zip not available' }
          $dest=Join-Path $env:RUNNER_TEMP 'FreeCAD'
          New-Item -ItemType Directory $dest -Force | Out-Null
          & $extractor x $archive "-o$dest" -y | Select-Object -Last 8
          if ($LASTEXITCODE -ne 0) { throw "7-Zip returned $LASTEXITCODE" }
          $exe=Get-ChildItem $dest -Recurse -File -Filter FreeCADCmd.exe | Select-Object -First 1
          if (!$exe) { throw 'FreeCADCmd.exe missing' }
          $exe.FullName | Set-Content (Join-Path $env:RUNNER_TEMP 'freecadcmd-path.txt')
      - name: Produce real 3D fluid cylinder and STEP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-Content (Join-Path $env:RUNNER_TEMP 'freecadcmd-path.txt') -Raw).Trim()
          $script=Join-Path $env:GITHUB_WORKSPACE 'tests\freecad_create_pipe.py'
          $env:CFD_STEP_OUT=Join-Path $env:GITHUB_WORKSPACE 'outputs\pipe_50mm_5m.step'
          New-Item -ItemType Directory (Join-Path $env:GITHUB_WORKSPACE 'outputs') -Force | Out-Null
          $p=Start-Process -FilePath $exe -ArgumentList @($script) -Wait -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'freecad_stdout.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'freecad_stderr.txt')
          Get-Content (Join-Path $env:RUNNER_TEMP 'freecad_stdout.txt') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP 'freecad_stderr.txt') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "FreeCAD exit code $($p.ExitCode)" }
          if (!(Test-Path $env:CFD_STEP_OUT)) { throw 'STEP missing' }
          $reportfile=$env:CFD_STEP_OUT.Replace('.step','.json')
          if (!(Test-Path $reportfile)) { throw 'Geometry JSON report missing' }
          $report=Get-Content $reportfile -Raw | ConvertFrom-Json
          if ($report.diameter_mm -ne 50 -or $report.length_mm -ne 5000 -or !$report.valid) { throw 'Geometry report invalid' }
          $expected=[math]::PI*25*25*5000
          if ([math]::Abs($report.volume_mm3/$expected-1) -gt 1e-7) { throw 'Fluid volume incorrect' }
          "### Verified 50 mm x 5 m FreeCAD cylinder" >> $env:GITHUB_STEP_SUMMARY
          "Fluid volume (L): $([math]::Round($report.volume_mm3/1e6,5))" >> $env:GITHUB_STEP_SUMMARY
      - name: Publish STEP and geometry report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-pipe-50mm-5m-step
          path: outputs/
          if-no-files-found: error
          retention-days: 7
